<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>压力表 · 独立指针检查</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e7ebee;color:#26333d;font:15px 'Microsoft YaHei',sans-serif}header{position:absolute;left:28px;top:24px;z-index:2}h1{font-size:22px;margin:0 0 10px}p{margin:5px 0;color:#52626e}.controls{position:absolute;right:30px;bottom:28px;background:#ffffffed;padding:22px 26px;border-radius:12px;box-shadow:0 8px 30px #23304020;min-width:275px}label{display:block;font-size:14px}input{width:100%;padding:9px 12px;margin:8px 0;border:1px solid #bdcbd3;border-radius:6px;font-size:20px}button{padding:8px 12px;margin-top:10px;border:1px solid #aabdc9;border-radius:5px;background:white;cursor:pointer}canvas{display:block}#status{font-size:13px;color:#247056}</style>
<header><h1>压力表 · 0–1.6 MPa</h1><p>刻度贴图与红色指针分离，指针绕表盘中心旋转</p><p id="status">正在读取项目模型…</p></header>
<div class="controls"><label for="pressure">压力（MPa）</label><input id="pressure" type="number" min="0" max="1.6" step="0.01" value="0.6"><p id="angle"></p><button id="pivot">显示中心轴心</button></div>
<script type="module">
import * as T from '../../vendor/three.module.js';
const saved=await(await fetch('../../api/project-models/d6b7bee9-ca9b-4f34-8335-d72ed3cc755d')).json();
const root=await new T.ObjectLoader().parseAsync(saved.scene);root.updateMatrixWorld(true);
const group=root.getObjectByName('压力表总成'),matrix=group.matrixWorld.clone();group.removeFromParent();matrix.decompose(group.position,group.quaternion,group.scale);
const scene=new T.Scene();scene.background=new T.Color('#e7ebee');scene.add(group);scene.updateMatrixWorld(true);
const face=group.getObjectByName('压力表_表盘'),needle=group.getObjectByName('指针');face.geometry.computeBoundingBox();
const center=face.localToWorld(face.geometry.boundingBox.getCenter(new T.Vector3()));group.position.sub(center);scene.updateMatrixWorld(true);
const normal=new T.Vector3(0,0,1).transformDirection(face.matrixWorld),up=new T.Vector3(0,1,0).transformDirection(face.matrixWorld),right=new T.Vector3(1,0,0).transformDirection(face.matrixWorld);
const camera=new T.OrthographicCamera(-8,8,5,-5,.1,100);camera.up.copy(up);camera.position.copy(normal).multiplyScalar(18).addScaledVector(right,1.7).addScaledVector(up,.4);camera.lookAt(0,0,0);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x78838f,2.5));const light=new T.DirectionalLight(0xffffff,3.5);light.position.copy(normal).multiplyScalar(10).addScaledVector(up,6).addScaledVector(right,-4);scene.add(light);
// Crosshair is at the actual pointer spindle, not at its geometry bounds center.
const origin=needle.getWorldPosition(new T.Vector3()).addScaledVector(normal,.08),a=origin.clone().addScaledVector(right,-.35),b=origin.clone().addScaledVector(right,.35),c=origin.clone().addScaledVector(up,-.35),d=origin.clone().addScaledVector(up,.35);
const cross=new T.LineSegments(new T.BufferGeometry().setFromPoints([a,b,c,d]),new T.LineBasicMaterial({color:0x16ae80,depthTest:false}));cross.renderOrder=10;cross.visible=false;scene.add(cross);
document.querySelector('#pivot').onclick=()=>{cross.visible=!cross.visible;document.querySelector('#pivot').textContent=cross.visible?'隐藏中心轴心':'显示中心轴心';};
function update(){const pressure=Math.min(1.6,Math.max(0,Number(document.querySelector('#pressure').value)||0)),angle=135-270*pressure/1.6;needle.rotation.z=angle*Math.PI/180;document.querySelector('#angle').textContent='指针局部 Z 轴角度：'+angle.toFixed(2)+'°';}document.querySelector('#pressure').addEventListener('input',update);update();
function resize(){const aspect=innerWidth/innerHeight;camera.left=-5.4*aspect;camera.right=5.4*aspect;camera.top=5.4;camera.bottom=-5.4;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}resize();addEventListener('resize',resize);
document.querySelector('#status').textContent='已载入：独立指针 / 表盘中心轴心 / 2048 px 刻度贴图';
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></html>
